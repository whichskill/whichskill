name: CI

# A skill repo has no build. What it does have are three ways to ship something
# broken silently, and this workflow closes all three.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No personal file may be tracked
        # Both of these are per-person. The catalogue is generated from one
        # machine's installed packs; the local arbitration is hand-written.
        # Committing either makes the router speak with someone else's mouth.
        #
        # For the catalogue it is not merely "not committed with real content" —
        # it is not tracked at all, and that distinction is the update path.
        # While it was tracked, generating it left every user's working tree
        # permanently dirty, and any future commit touching the file aborted
        # their `git pull` with "Please commit your changes or stash them before
        # you merge." An install that cannot be updated is worse than one that
        # fails loudly.
        #
        # Fix either with: git rm --cached <file>
        run: |
          fail=0
          for f in references/catalogue.md references/arbitration.local.md; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error file=$f::$f is tracked. It is per-person and must stay out of git."
              fail=1
            fi
          done
          exit $fail

      - name: A hand-written arbitration survives a skill update
        # The reason this file moved out of the skill folder. `npx skills update`
        # overwrites the skill directory wholesale, which was measured to delete
        # references/arbitration.local.md with no warning. The generator migrates
        # anyone still holding one at the old path — if that migration breaks,
        # the next update silently eats their work.
        run: |
          export WHICH_SKILL_HOME="$HOME/.which-skill-citest"
          mkdir -p "$HOME/.claude/skills" "$HOME/.claude/plugins/cache"
          printf '## Reviewing code\n\n- `/mine` wins.\n' > references/arbitration.local.md

          bash scripts/build-catalogue.sh

          if [ -f references/arbitration.local.md ]; then
            echo "::error::the legacy arbitration was left in the skill folder, where an update destroys it"
            exit 1
          fi
          if ! grep -q '/mine' "$WHICH_SKILL_HOME/arbitration.local.md"; then
            echo "::error::the arbitration did not arrive intact at $WHICH_SKILL_HOME"
            exit 1
          fi

          # Two files, no destination clash: neither may be silently overwritten.
          printf 'legacy again\n' > references/arbitration.local.md
          bash scripts/build-catalogue.sh | grep -q 'BOTH' \
            || { echo "::error::a collision between old and new paths was not reported"; exit 1; }
          grep -q '/mine' "$WHICH_SKILL_HOME/arbitration.local.md" \
            || { echo "::error::the existing arbitration was overwritten by the legacy one"; exit 1; }

          rm -f references/arbitration.local.md references/catalogue.md
          rm -rf "$WHICH_SKILL_HOME"

      - name: SKILL.md must stay discoverable
        # No frontmatter, no name, or no description means the harness never
        # surfaces the skill. It fails by being invisible, which is the hardest
        # failure to notice.
        #
        # Parsed with a STRICT YAML parser, not grepped. Claude Code accepts
        # frontmatter that stricter installers reject, so a grep for the line
        # passes while the skill is unusable elsewhere. That is not theoretical:
        # an unquoted `: ` inside the description shipped in the first release,
        # and `npx skills add whichskill/whichskill` answered "No valid skills
        # found" — a clone that installs nothing, silently.
        run: |
          python3 - <<'PY'
          import sys, yaml
          text = open("SKILL.md", encoding="utf-8").read()
          if not text.startswith("---"):
              sys.exit("::error::SKILL.md does not open with YAML frontmatter")
          block = text.split("---", 2)[1]
          try:
              fm = yaml.safe_load(block)
          except yaml.YAMLError as e:
              sys.exit(f"::error file=SKILL.md::frontmatter is not valid YAML — strict installers will skip this skill entirely.\n{e}")
          if not isinstance(fm, dict):
              sys.exit("::error file=SKILL.md::frontmatter did not parse to a mapping")
          if fm.get("name") != "which-skill":
              sys.exit(f"::error file=SKILL.md::name must be 'which-skill', got {fm.get('name')!r}")
          desc = fm.get("description") or ""
          if len(desc) < 80:
              sys.exit("::error file=SKILL.md::description is what triggers the skill; it needs to be substantial")
          print(f"frontmatter OK — description is {len(desc)} chars")
          PY

      - name: Shell scripts parse and lint
        run: |
          bash -n scripts/build-catalogue.sh
          shellcheck scripts/build-catalogue.sh

      - name: The catalogue generator runs on a clean machine
        # Proves the script survives an empty ~/.claude/skills — the exact state
        # of someone who just cloned this. It must produce a file with the four
        # section headings, not crash on the empty globs.
        run: |
          mkdir -p "$HOME/.claude/skills" "$HOME/.claude/plugins/cache"
          bash scripts/build-catalogue.sh
          grep -q '^## gstack$' references/catalogue.md
          grep -q '^## Standalone$' references/catalogue.md
          rm references/catalogue.md   # untracked, so there is nothing to check out
