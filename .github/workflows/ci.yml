name: CI

# A skill repo has no build. What it does have are three ways to ship something
# broken silently, and this workflow closes all three.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The catalogue must never be committed
        # references/catalogue.md is generated from whoever runs the script.
        # Committing a real one makes the router recommend commands the person
        # installing this does not have — confident, and useless. This is the
        # single most likely accident in this repo, so it fails the build.
        run: |
          if ! grep -q 'NOT GENERATED' references/catalogue.md; then
            echo "::error file=references/catalogue.md::A generated catalogue was committed."
            echo "references/catalogue.md must keep its NOT GENERATED placeholder."
            echo "Restore it with: git checkout main -- references/catalogue.md"
            exit 1
          fi

      - name: SKILL.md must stay discoverable
        # No frontmatter, no name, or no description means the harness never
        # surfaces the skill. It fails by being invisible, which is the hardest
        # failure to notice.
        #
        # Parsed with a STRICT YAML parser, not grepped. Claude Code accepts
        # frontmatter that stricter installers reject, so a grep for the line
        # passes while the skill is unusable elsewhere. That is not theoretical:
        # an unquoted `: ` inside the description shipped in the first release,
        # and `npx skills add whichskill/whichskill` answered "No valid skills
        # found" — a clone that installs nothing, silently.
        run: |
          python3 - <<'PY'
          import sys, yaml
          text = open("SKILL.md", encoding="utf-8").read()
          if not text.startswith("---"):
              sys.exit("::error::SKILL.md does not open with YAML frontmatter")
          block = text.split("---", 2)[1]
          try:
              fm = yaml.safe_load(block)
          except yaml.YAMLError as e:
              sys.exit(f"::error file=SKILL.md::frontmatter is not valid YAML — strict installers will skip this skill entirely.\n{e}")
          if not isinstance(fm, dict):
              sys.exit("::error file=SKILL.md::frontmatter did not parse to a mapping")
          if fm.get("name") != "which-skill":
              sys.exit(f"::error file=SKILL.md::name must be 'which-skill', got {fm.get('name')!r}")
          desc = fm.get("description") or ""
          if len(desc) < 80:
              sys.exit("::error file=SKILL.md::description is what triggers the skill; it needs to be substantial")
          print(f"frontmatter OK — description is {len(desc)} chars")
          PY

      - name: Shell scripts parse and lint
        run: |
          bash -n scripts/build-catalogue.sh
          shellcheck scripts/build-catalogue.sh

      - name: The catalogue generator runs on a clean machine
        # Proves the script survives an empty ~/.claude/skills — the exact state
        # of someone who just cloned this. It must produce a file with the four
        # section headings, not crash on the empty globs.
        run: |
          mkdir -p "$HOME/.claude/skills" "$HOME/.claude/plugins/cache"
          bash scripts/build-catalogue.sh
          grep -q '^## gstack$' references/catalogue.md
          grep -q '^## Standalone$' references/catalogue.md
          git checkout -- references/catalogue.md
